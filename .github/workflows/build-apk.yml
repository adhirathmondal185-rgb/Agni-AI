name: Build Agni AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1 & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "cmdline-tools;latest" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "build-tools;36.1.0" || true
            ls -la "$SDK_DIR/platforms" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2 --console=plain 2>&1 | tee build.log

      - name: Report exact error in Annotations
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR_LINES="$(grep -E "FAILURE:|What went wrong:|Caused by:|> Could not|> Keystore|> Execution failed|e: file:" build.log | head -n 12 | tr '\n' ' ' | cut -c1-900)"
            if [ -z "$ERR_LINES" ]; then
              ERR_LINES="$(tail -n 15 build.log | tr '\n' ' ' | cut -c1-900)"
            fi
            echo "::error title=Exact Gradle Error::$ERR_LINES"
            {
              echo "## Exact Gradle Error"
              echo '```text'
              tail -n 60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Agni-AI-debug.apk

      - name: Upload Agni AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Agni-AI-APK
          path: Agni-AI-debug.apk
          retention-days: 30
