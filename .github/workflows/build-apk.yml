name: Build Agni AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1 & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "cmdline-tools;latest" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            fi
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "build-tools;36.1.0" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Firebase config, signing keystore, and env
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ ! -f app/google-services.json ]; then
            echo "::warning title=Firebase Config Missing::app/google-services.json was not synced. Add GOOGLE_SERVICES_JSON in GitHub Secrets for Google Sign-In & Firebase AI."
          fi

          if [ ! -f debug.keystore ] && [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          fi

          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f .env ]; then
            touch .env
          fi

          FP_LINES="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E 'SHA1:|SHA256:' | sed 's/^[[:space:]]*//' || true)"
          if [ -n "$FP_LINES" ]; then
            FP_ONE_LINE="$(printf '%s' "$FP_LINES" | tr '\n' ' ')"
            echo "::notice title=APK Signing Fingerprints::$FP_ONE_LINE"
            {
              echo "## APK Signing Fingerprints"
              echo '```text'
              echo "$FP_LINES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2 --console=plain 2>&1 | tee build.log

      - name: Report exact error in Annotations
        if: failure()
        run: |
          if [ -f build.log ]; then
            ERR_LINES="$(grep -E "FAILURE:|What went wrong:|Caused by:|> Could not|> Keystore|> Execution failed|e: file:" build.log | head -n 12 | tr '\n' ' ' | cut -c1-900)"
            if [ -z "$ERR_LINES" ]; then
              ERR_LINES="$(tail -n 15 build.log | tr '\n' ' ' | cut -c1-900)"
            fi
            echo "::error title=Exact Gradle Error::$ERR_LINES"
          fi

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Agni-AI-debug.apk

      - name: Upload Agni AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Agni-AI-APK
          path: Agni-AI-debug.apk
          retention-days: 30
