name: Build Agni AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore and env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk Agni-AI-debug.apk

      - name: Upload Agni AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Agni-AI-APK
          path: Agni-AI-debug.apk
          retention-days: 30
